# Host nginx server block for MicroMachines.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then
# run certbot --nginx to add the TLS listener and the port-80 redirect.
#
# Upstream is the frontend container (SPA + /api proxy to the backend),
# published on loopback only by docker-compose.prod.yml.

server {
    listen 80;
    listen [::]:80;
    server_name optionscreener.online www.optionscreener.online;

    # Product images and AI upload payloads
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
